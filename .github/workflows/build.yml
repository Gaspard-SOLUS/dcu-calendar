name: Rebuild calendar feed

# Runs the generator whenever one of its inputs changes, commits the
# regenerated .ics, and pushes it — no local Python/pandas setup needed for a
# routine refresh: drop the new Timetables.xlsx in the repo, or edit
# overrides.csv/config.json/buildings.json, and push.
on:
  push:
    branches: [main]
    paths:
      - "Timetables.xlsx"
      - "overrides.csv"
      - "config.json"
      - "buildings.json"
      - "dcu_to_ics.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Show what would change
        run: python dcu_to_ics.py --diff DCU_Semester1_2026.ics

      - name: Build the feed
        run: python dcu_to_ics.py

      - name: Commit if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DCU_Semester1_2026.ics
          git diff --cached --quiet || git commit -m "Auto-rebuild: $(date -u +%F)"
          git push
